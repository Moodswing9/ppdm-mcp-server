name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please remove hostnames, usernames and other details about your environment before submitting.
  - type: input
    id: version
    attributes:
      label: ppdm-mcp-server version
      placeholder: e.g. 4.1.1
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Which system?
      options: [PPDM, NetWorker, Data Domain, Not system-specific]
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: PPDM / NetWorker / Data Domain version
      placeholder: e.g. PPDM 19.15
  - type: input
    id: tool
    attributes:
      label: Tool you called
      placeholder: e.g. list_failed_jobs
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or output
      render: text
